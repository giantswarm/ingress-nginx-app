# Watches the Chainguard registry for ingress-nginx-controller tags and hands
# each one to the "Mirror cgr ingress-nginx-controller" workflow, which copies
# the image into the Giant Swarm private registries.
#
# Every tag matching `TAG_PATTERN` at or above `MIN_TAG` is dispatched on each
# run, newest first - there is no bookkeeping of what was mirrored before. That
# is safe because `.github/scripts/mirror-image.sh` treats destination tags as
# immutable and exits early when the tag already exists, so re-dispatching an
# already-mirrored tag is a cheap no-op and a previously failed mirror is
# retried automatically on the next run.
#
# Note that bare release tags move at the source - `v1.15.10` is currently the
# same digest as `v1.15.10-r5` and follows every rebuild - while the destination
# is immutable. A bare tag is therefore pinned to whichever revision it pointed
# at when it was first mirrored, and later rebuilds are reported as a digest
# mismatch instead of being overwritten. Pin a revision tag in the chart to get
# an exact image.

name: "Check cgr ingress-nginx-controller releases"

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list the tags that would be mirrored, do not dispatch"
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: check-cgr-controller-releases
  cancel-in-progress: false

env:
  # Registry the tags are discovered in. Must match SOURCE_IMAGE of the mirror
  # workflow.
  SOURCE_IMAGE: "cgr.dev/adidas.com/ingress-nginx-controller"
  # Only tags matching this pattern are mirrored: a release (`v1.15.10`) or one
  # of its revisions (`v1.15.10-r5`). The variant tags Chainguard publishes
  # alongside them (`-slim`, `-dev`, `-nginx.1.27`, ...) are deliberately left
  # out.
  TAG_PATTERN: '^v1\.15\.[0-9]+(-r[0-9]+)?$'
  # Oldest tag to mirror. Anything below this is skipped, comparison is
  # inclusive.
  MIN_TAG: "v1.15.10-r5"
  # Workflow that performs the actual mirroring.
  MIRROR_WORKFLOW: "mirror-cgr-controller-image.yaml"

jobs:
  dispatch:
    name: "Dispatch mirror runs"
    runs-on: ubuntu-latest
    permissions:
      actions: write # required to dispatch the mirror workflow
      contents: read
      id-token: write # required for keyless auth to cgr.dev via Chainguard OIDC
    steps:
      - name: Download crane
        uses: giantswarm/install-binary-action@5bef88f65012037dd836117c8d344b21bb559854 # v4.1.0
        with:
          binary: "crane"
          version: "0.22.1"
          download_url: "https://github.com/google/go-containerregistry/releases/download/v${version}/go-containerregistry_Linux_x86_64.tar.gz"
          tarball_binary_path: "crane"
          smoke_test: "${binary} version"

      - name: Authenticate to Chainguard registry
        uses: chainguard-dev/setup-chainctl@2cddd35a2f120d9973e58094dc6878c93cf58c28 # v0.5.1
        with:
          identity: ${{ secrets.CHAINGUARD_IDENTITY }}

      - name: Find controller tags
        id: tags
        run: |
          set -euo pipefail

          # `|| true` keeps a non-matching grep from aborting the step under
          # `pipefail`, so the empty result is reported below instead.
          candidates="$(crane ls "${SOURCE_IMAGE}" \
            | { grep -E "${TAG_PATTERN}" || true; })"

          # Keep a tag when MIN_TAG sorts first, i.e. tag >= MIN_TAG. Using
          # `sort -V` rather than a regex keeps the bound readable and orders
          # both components numerically, so v1.15.10 lands above v1.15.9 and
          # v1.15.10-r10 above v1.15.10-r5.
          tags="$(while read -r tag; do
            [ -n "${tag}" ] || continue
            if [ "$(printf '%s\n%s\n' "${MIN_TAG}" "${tag}" | sort -V | head -n1)" = "${MIN_TAG}" ]; then
              echo "${tag}"
            else
              echo "Skipping ${tag}: older than ${MIN_TAG}" >&2
            fi
          done <<< "${candidates}" | sort -Vr)"

          # MIN_TAG itself is published, so an empty result means discovery
          # broke rather than that there is nothing to do.
          if [ -z "${tags}" ]; then
            echo "::error::No tags in ${SOURCE_IMAGE} matched ${TAG_PATTERN} at or above ${MIN_TAG}."
            exit 1
          fi

          echo "Found tags (newest first):"
          echo "${tags}"

          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Dispatch mirror workflow per tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAGS: ${{ steps.tags.outputs.tags }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "${DRY_RUN}" = "true" ]; then
            echo "### Dry run - no mirror runs dispatched" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "### Dispatched mirror runs" >> "${GITHUB_STEP_SUMMARY}"
          fi

          # Newest tag first, so it wins the race for a runner when the batch
          # queues behind other jobs.
          while read -r tag; do
            [ -n "${tag}" ] || continue

            if [ "${DRY_RUN}" = "true" ]; then
              echo "Would dispatch ${MIRROR_WORKFLOW} for ${tag}"
              echo "- \`${tag}\`" >> "${GITHUB_STEP_SUMMARY}"
              continue
            fi

            echo "Dispatching ${MIRROR_WORKFLOW} for ${tag}"
            gh workflow run "${MIRROR_WORKFLOW}" --field "tag=${tag}"
            echo "- \`${tag}\`" >> "${GITHUB_STEP_SUMMARY}"
          done <<< "${TAGS}"
